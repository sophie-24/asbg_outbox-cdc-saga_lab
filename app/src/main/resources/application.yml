spring:
  application:
    name: outbox-lab-app
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:outboxlab}
    username: ${DB_USERNAME:outboxlab}
    password: ${DB_PASSWORD:outboxlab}
  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway가 관리하고, JPA는 검증만 한다
    open-in-view: false     # OSIV를 꺼서 트랜잭션 경계를 서비스 계층으로 명시적으로 제한한다
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

# 워크숍 UI(S3/CloudFront)가 이 API를 다른 오리진에서 직접 호출한다.
# 쿠키/자격증명을 쓰지 않는 REST API라 기본값은 넓게 열어두고,
# 실제 배포 시 CORS_ALLOWED_ORIGINS 환경변수로 CloudFront 도메인만 허용하도록 좁힌다.
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

management:
  endpoints:
    web:
      exposure:
        include: health   # 헬스체크 외 actuator 엔드포인트는 노출하지 않는다
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.asbg.outboxlab: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
